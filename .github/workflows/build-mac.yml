name: Build Mac archives
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:desktop
      - run: npm run test:visual
      - run: npm run dist:mac
      - name: Reject modified bundles and verify both archives
        run: npm run verify:mac -- --test-tamper
      - run: npm run test:packaged
      - run: cp docs/MAC-FIRST-OPEN.md release/MAC-FIRST-OPEN.md
      - uses: actions/upload-artifact@v4
        with:
          name: QuizMeadow-mac
          path: |
            release/QuizMeadow-mac-*.zip
            release/SHA256SUMS.txt
            release/MAC-FIRST-OPEN.md
          if-no-files-found: error
